# Tool configuration shared by local runs and CI.

[flake8]
max-line-length = 88
max-complexity = 10
exclude = .git,__pycache__,.venv,venv,build,dist

[mypy]
files = pysds011, test, examples

[tool:pytest]
testpaths = test
addopts = --cov=pysds011 --cov-report=term-missing

[coverage:report]
fail_under = 80
